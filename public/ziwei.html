<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>紫微斗数 - 每日运势</title>
<style>
/* ═══ DESIGN SYSTEM ═══ */
:root {
  --bg: #F4F1EA;
  --surface: #FFFFFF;
  --surface-2: #FAF7F2;
  --text: #1C1A17;
  --text-2: #6A645C;
  --text-3: #8C867C;
  --border: #E5DED4;
  --gold: #B8860B;
  --gold-line: #CAA94E;
  --gold-soft: #FAF2DC;
  --gold-text: #6B520A;
  --shadow-sm: 0 1px 2px rgba(28,26,23,0.04), 0 1px 4px rgba(28,26,23,0.03);
  --shadow-md: 0 4px 16px rgba(28,26,23,0.06), 0 1px 4px rgba(28,26,23,0.03);
  --shadow-lg: 0 12px 40px rgba(28,26,23,0.10), 0 2px 8px rgba(28,26,23,0.04);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --font-serif: 'Georgia', 'Songti SC', serif;
  --font-sans: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151312;
    --surface: #1E1C19;
    --surface-2: #26231F;
    --text: #E8E2D8;
    --text-2: #9B9489;
    --text-3: #6E685E;
    --border: #2E2B27;
    --gold: #D4A853;
    --gold-line: #CAA94E;
    --gold-soft: #2E2A20;
    --gold-text: #E0C07A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2), 0 1px 4px rgba(0,0,0,0.15);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.2);
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

.container {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 20px 16px;
  text-align: center;
}

.header__title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 500;
  color: var(--gold);
  margin-bottom: 4px;
}

.header__subtitle {
  font-size: 0.8rem;
  color: var(--text-3);
}

.main {
  padding: 20px;
}

.user-selector {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.user-btn {
  flex: 1;
  height: 64px;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-sm);
}

.user-btn:hover {
  background: var(--gold-soft);
  border-color: var(--gold-line);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.user-btn--active {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.date-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 24px;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.date-card__label {
  font-size: 0.75rem;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

.date-card__value {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  color: var(--text);
  font-weight: 500;
}

.fortune-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px;
  min-height: 400px;
  box-shadow: var(--shadow-sm);
}

.loading {
  text-align: center;
  color: var(--text-3);
  font-size: 0.95rem;
  padding: 60px 0;
}

.fortune-section {
  margin-bottom: 28px;
}

.fortune-section:last-child {
  margin-bottom: 0;
}

.fortune__title {
  font-size: 0.8rem;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.fortune__content {
  font-size: 0.95rem;
  color: var(--text);
  line-height: 1.7;
}

.luck-item {
  margin-bottom: 20px;
}

.luck-item:last-child {
  margin-bottom: 0;
}

.luck-item__name {
  font-weight: 600;
  margin-bottom: 8px;
  font-size: 1rem;
}

.stars {
  display: flex;
  gap: 4px;
  font-size: 1.3rem;
  color: var(--gold);
  margin-bottom: 6px;
}

.luck-item__text {
  font-size: 0.9rem;
  color: var(--text-2);
  line-height: 1.6;
}

.suggestions-list {
  margin: 0;
  padding-left: 20px;
  line-height: 2;
}

.suggestions-list li {
  color: var(--text-2);
  font-size: 0.9rem;
}

.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-3);
  font-size: 0.75rem;
}

.error {
  text-align: center;
  color: #C4554D;
  padding: 40px 20px;
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1 class="header__title">紫微斗数</h1>
    <p class="header__subtitle">每日运势查询</p>
  </header>

  <main class="main">
    <!-- 用户选择 -->
    <div class="user-selector">
      <button class="user-btn user-btn--active" data-user="joey">Jian</button>
      <button class="user-btn" data-user="wife">老婆</button>
    </div>

    <!-- 今日日期 -->
    <div class="date-card">
      <div class="date-card__label">今日运势</div>
      <div class="date-card__value" id="todayDate">加载中...</div>
    </div>

    <!-- 运势内容 -->
    <div class="fortune-card" id="fortuneCard">
      <div class="loading">正在计算运势...</div>
    </div>
  </main>

  <footer class="footer">
    数据仅供参考 · 娱乐为主
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/iztro@2.6.0/dist/iztro.min.js"></script>
<script type="module">
let currentUser = 'joey';

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  setupUserSelector();
  updateTodayDate();
  loadFortune(currentUser);
});

// 用户选择器
function setupUserSelector() {
  const buttons = document.querySelectorAll('.user-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const userId = btn.dataset.user;
      currentUser = userId;

      buttons.forEach(b => b.classList.remove('user-btn--active'));
      btn.classList.add('user-btn--active');

      loadFortune(userId);
    });
  });
}

// 更新今日日期
function updateTodayDate() {
  const today = new Date();
  const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 ${weekdays[today.getDay()]}`;
  document.getElementById('todayDate').textContent = dateStr;
}

// 加载运势
async function loadFortune(userId) {
  const card = document.getElementById('fortuneCard');
  card.innerHTML = '<div class="loading">正在计算运势...</div>';

  try {
    const response = await fetch(`/api/v1/ziwei/daily/${userId}`);
    if (!response.ok) throw new Error('请求失败');

    const result = await response.json();
    const fortune = calculateFortune(result.data);
    renderFortune(fortune);
  } catch (error) {
    console.error('[Ziwei Error]', error);
    card.innerHTML = '<div class="error">加载失败，请稍后重试</div>';
  }
}

// 计算运势（使用 iztro）
function calculateFortune(data) {
  const { birthInfo, today } = data;

  // 使用 iztro 排盘
  const astrolabe = window.iztro.astro.bySolar(
    birthInfo.date,
    birthInfo.time,
    birthInfo.gender,
    true,
    'zh-CN'
  );

  // 简化的运势分析（实际项目中需要更复杂的逻辑）
  return {
    user: data.user,
    date: today,
    career: { score: 4, text: '事业运势平稳，适合推进已有项目，保持稳扎稳打的节奏' },
    wealth: { score: 5, text: '财运较佳，可关注投资机会，但需谨慎评估风险' },
    relationship: { score: 3, text: '感情运势平稳，注意沟通交流，多一些耐心和理解' },
    health: { score: 4, text: '健康状况良好，注意作息规律，适当运动放松' },
    suggestions: [
      '适合处理财务相关事项',
      '午时运势较佳，重要决策可在此时进行',
      '注意人际关系的维护，多与朋友交流'
    ]
  };
}

// 渲染运势
function renderFortune(fortune) {
  const card = document.getElementById('fortuneCard');

  const html = `
    <div class="fortune-section">
      <div class="fortune__title">🌟 综合运势</div>
      <div class="fortune__content">
        <div class="luck-item">
          <div class="luck-item__name">事业运</div>
          <div class="stars">${renderStars(fortune.career.score)}</div>
          <div class="luck-item__text">${fortune.career.text}</div>
        </div>
        <div class="luck-item">
          <div class="luck-item__name">财运</div>
          <div class="stars">${renderStars(fortune.wealth.score)}</div>
          <div class="luck-item__text">${fortune.wealth.text}</div>
        </div>
        <div class="luck-item">
          <div class="luck-item__name">感情运</div>
          <div class="stars">${renderStars(fortune.relationship.score)}</div>
          <div class="luck-item__text">${fortune.relationship.text}</div>
        </div>
        <div class="luck-item">
          <div class="luck-item__name">健康运</div>
          <div class="stars">${renderStars(fortune.health.score)}</div>
          <div class="luck-item__text">${fortune.health.text}</div>
        </div>
      </div>
    </div>

    <div class="fortune-section">
      <div class="fortune__title">💡 今日建议</div>
      <div class="fortune__content">
        <ul class="suggestions-list">
          ${fortune.suggestions.map(s => `<li>${s}</li>`).join('')}
        </ul>
      </div>
    </div>
  `;

  card.innerHTML = html;
}

// 渲染星级
function renderStars(score) {
  const full = Math.floor(score);
  const empty = 5 - full;
  return '★'.repeat(full) + '☆'.repeat(empty);
}
</script>
</body>
</html>
