<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Joeyzou记账本</title>
<style>
/* ═══ DESIGN SYSTEM ═══
   暖奢记账：米白底 + 金色点缀 + 深绿利润
   为二奢店销售打造的个人工作台 */
:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --surface-2: #FAF7F2; --surface-3: #F0EBE1;
  --text: #1C1A17; --text-2: #6A645C; --text-3: #8C867C;
  --border: #E5DED4; --border-strong: #D0C8BA;
  --accent: #2A231C; --accent-soft: #E6DFD4;
  --gold: #B8860B; --gold-line: #CAA94E; --gold-soft: #FAF2DC; --gold-text: #6B520A;
  --success: #3A7D3A; --success-soft: #E6F0E6;
  --info: #4A7D9E; --info-soft: #E4EDF3;
  --recovery: #7A6BA0; --recovery-soft: #EDE9F5;
  --danger: #C4554D; --danger-soft: #FAE8E6;
  --shadow-sm: 0 1px 2px rgba(28,26,23,0.04), 0 1px 4px rgba(28,26,23,0.03);
  --shadow-md: 0 4px 16px rgba(28,26,23,0.06), 0 1px 4px rgba(28,26,23,0.03);
  --shadow-lg: 0 12px 40px rgba(28,26,23,0.10), 0 2px 8px rgba(28,26,23,0.04);
  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 28px;
  --font-serif: 'Georgia', 'Songti SC', serif;
  --font-numeric: -apple-system, 'SF Pro Text', 'SF Pro Display', 'PingFang SC', ui-sans-serif, sans-serif;
  --font-sans: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --header-h: 52px;
  --content-pad: 20px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --transition: 0.25s var(--ease);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151312; --surface: #1E1C19; --surface-2: #26231F; --surface-3: #2E2B27;
    --text: #E8E2D8; --text-2: #9B9489; --text-3: #6E685E;
    --border: #2E2B27; --border-strong: #3D3934;
    --accent: #F0E9DC; --accent-soft: #2E2B27;
    --gold: #D4A853; --gold-line: #CAA94E; --gold-soft: #2E2A20; --gold-text: #E0C07A;
    --success: #6BA86B; --success-soft: #1E2A1E;
    --info: #6A9DBE; --info-soft: #1E2530;
    --recovery: #9A8BC0; --recovery-soft: #252030;
    --danger: #E07870; --danger-soft: #2A1E1C;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2), 0 1px 4px rgba(0,0,0,0.15);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.2);
  }
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  line-height: 1.6; min-height: 100dvh;
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 430px; margin: 0 auto; height: 100dvh;
  display: flex; flex-direction: column; position: relative;
}
.app::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--gold-line) 28%, var(--gold) 50%, var(--gold-line) 72%, transparent 100%);
  z-index: 300; pointer-events: none;
}

/* ═══ HEADER ═══ */
.header {
  padding-top: var(--safe-top);
  padding-left: var(--content-pad); padding-right: var(--content-pad);
  flex-shrink: 0; border-bottom: 1px solid var(--border);
  background: var(--surface); position: relative;
}
.header__top {
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
}
.header__title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600; letter-spacing: 0.01em; }
.header__subtitle { font-size: 0.72rem; color: var(--text-3); margin-bottom: 10px; letter-spacing: 0.02em; }

/* ═══ SELLER TABS ═══ */
.seller-tabs {
  display: flex; background: var(--surface-2);
  border-radius: var(--radius-md); padding: 3px; margin-bottom: 14px;
}
.seller-tab {
  flex: 1; height: 40px; border: none; border-radius: calc(var(--radius-md) - 2px);
  font-family: inherit; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; background: transparent; color: var(--text-3);
  transition: all var(--transition);
}
.seller-tab--active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seller-tab[data-seller="company"].seller-tab--active {
  border-left: 3px solid var(--info);
}
.seller-tab[data-seller="personal"].seller-tab--active {
  border-left: 3px solid var(--gold);
}

/* ═══ VIEW TABS (交易明细 / 月度统计) ═══ */
.view-tabs {
  display: flex; background: var(--surface-2);
  border-radius: var(--radius-md); padding: 3px; margin-bottom: 14px;
}
.view-tab {
  flex: 1; height: 40px; border: none; border-radius: calc(var(--radius-md) - 2px);
  font-family: inherit; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; background: transparent; color: var(--text-3);
  transition: all var(--transition);
}
.view-tab--active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ═══ CONTENT ═══ */
.content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 18px var(--content-pad) calc(var(--safe-bottom) + 88px);
}
.content::-webkit-scrollbar { width: 0; }

/* ═══ STATS ═══ */
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
}
.stats-grid--2 { grid-template-columns: repeat(2, 1fr); }

/* 窄屏幕优化：< 360px 时改为 2 列 */
@media (max-width: 359px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
}

.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 16px 12px; text-align: center;
  position: relative; transition: box-shadow var(--transition);
}
.stat-card__label { font-size: 0.62rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 600; }
.stat-card__value { font-family: var(--font-numeric); font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat-card--profit { border-top: 3px solid var(--gold); }
.stat-card--profit .stat-card__value { color: var(--success); font-size: 1.45rem; }
.stat-card--profit .stat-card__label { color: var(--gold-text); }
.stat-card--base .stat-card__value { color: var(--text-2); }

/* ═══ FILTER ═══ */
.filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filter-bar input, .filter-bar select {
  height: 44px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0 12px; font-family: inherit; font-size: 0.82rem;
  background: var(--surface); color: var(--text); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.filter-bar input:focus, .filter-bar select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.10); }
.filter-bar input[type="month"] { flex: 1; min-width: 140px; font-family: var(--font-numeric); }
.filter-bar select { flex: 1; min-width: 100px; }
.month-nav {
  display: flex; gap: 6px;
}
.month-nav__btn {
  width: 44px; height: 44px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
  font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.month-nav__btn:hover { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-text); }
.month-nav__btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ═══ SECTION ═══ */
.section__header { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 12px; }
.section__title { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; }

/* ═══ TXN LIST ═══ */
.txn-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px; margin-bottom: 8px;
  transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
  animation: listIn 0.3s var(--ease) both;
}
.txn-item:active { transform: scale(0.985); box-shadow: var(--shadow-sm); }
.txn-item__info { flex: 1; min-width: 0; }
.txn-item__title { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.txn-item__brand { font-size: 0.68rem; font-weight: 600; color: var(--gold-text); background: var(--gold-soft); padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
.txn-item__meta { font-size: 0.7rem; color: var(--text-3); margin-top: 3px; line-height: 1.4; }
.txn-item__amount { font-family: var(--font-numeric); font-size: 1.05rem; font-weight: 600; color: var(--success); white-space: nowrap; font-variant-numeric: tabular-nums; }
.txn-item__delete {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--surface-2); color: var(--text-3); cursor: pointer;
  flex-shrink: 0; font-size: 1rem; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.txn-item__delete:hover { background: var(--danger); color: #fff; }
.txn-item__copy {
  height: 36px; padding: 0 12px; border-radius: 18px; border: none;
  background: var(--gold-soft); color: var(--gold-text); cursor: pointer;
  flex-shrink: 0; font-size: 0.7rem; font-weight: 600; transition: all 0.2s;
}
.txn-item__copy:hover { background: var(--gold); color: #fff; }
.channel-badge {
  display: inline-flex; align-items: center; font-size: 0.6rem; font-weight: 700;
  padding: 2px 6px; border-radius: 5px; letter-spacing: 0.03em; flex-shrink: 0;
}
.channel-badge--quota { background: var(--gold-soft); color: var(--gold-text); }
.channel-badge--direct { background: var(--info-soft); color: var(--info); }
.channel-badge--recovery { background: var(--recovery-soft); color: var(--recovery); }
.channel-badge--other { background: var(--accent-soft); color: var(--text-2); }
.seller-badge {
  display: inline-block; font-size: 0.55rem; font-weight: 700;
  padding: 2px 5px; border-radius: 4px; margin-right: 2px; letter-spacing: 0.04em;
}
.seller-badge--company { background: var(--info-soft); color: var(--info); }
.seller-badge--personal { background: var(--gold-soft); color: var(--gold-text); }

/* ═══ FAB & MODAL ═══ */
.fab {
  position: fixed; bottom: calc(var(--safe-bottom) + 18px);
  right: max(18px, calc(50% - 199px));
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--gold); color: #fff; border: none;
  font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 12px rgba(184,134,11,0.30);
  z-index: 90; display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
}
.fab:hover { box-shadow: 0 6px 16px rgba(184,134,11,0.40); }
.fab:active { transform: scale(0.92); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20,18,15,0.35);
  z-index: 200; display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay--open { display: flex; }
.modal {
  background: var(--surface); width: 100%; max-width: 430px;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  animation: slideUp 0.3s var(--ease); max-height: 90dvh; overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal__handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 18px; }
.modal__title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 18px; }

/* Modal seller indicator */
.modal__seller-indicator {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 16px; padding: 10px 16px;
  background: var(--surface-2); border-radius: var(--radius-sm);
}
.modal__seller-label {
  font-size: 0.75rem; color: var(--text-3); font-weight: 500;
}
.modal__seller-badge {
  font-size: 0.8rem; font-weight: 700; padding: 4px 12px;
  border-radius: 8px; letter-spacing: 0.02em;
  transition: all 0.3s var(--ease);
}
.modal__seller-badge--company {
  background: var(--info-soft); color: var(--info);
  border: 2px solid var(--info);
}
.modal__seller-badge--personal {
  background: var(--gold-soft); color: var(--gold-text);
  border: 2px solid var(--gold);
}

/* ═══ FORM ═══ */
.form-field { margin-bottom: 14px; }
.form-field__label {
  font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 5px; display: block;
}
.form-field__input, .form-field__select {
  width: 100%; height: 44px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 12px; font-family: inherit;
  font-size: 0.9rem; background: var(--surface-2); color: var(--text);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.form-field__input:focus, .form-field__select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.10); background: var(--surface); }
.form-field__input--locked { background: var(--surface-2); color: var(--text-2); cursor: default; }
.form-field__input--locked:focus { border-color: var(--border); box-shadow: none; background: var(--surface-2); }
.form-field__input--number { text-align: right; font-family: var(--font-numeric); font-weight: 600; font-variant-numeric: tabular-nums; }
/* 隐藏原生数字输入微调器，用自定义步进按钮 */
.form-field__input--number::-webkit-outer-spin-button,
.form-field__input--number::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.form-field__input--number { -moz-appearance: textfield; }
.form-field__error { font-size: 0.7rem; color: var(--danger); margin-top: 4px; }
.form-field__hint { font-size: 0.7rem; color: var(--text-3); margin-top: 4px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-field { flex: 1; }

/* Channel tabs */
.channel-tabs { display: flex; gap: 6px; }
.channel-tab {
  flex: 1; height: 38px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-family: inherit;
  font-size: 0.82rem; font-weight: 600; cursor: pointer;
  background: var(--surface); color: var(--text-3); transition: all 0.2s;
}
.channel-tab--active { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-text); }

/* ═══ 智能解析入口 ═══ */
.parse-bar { margin-bottom: 16px; }
.parse-bar__label {
  font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--gold-text); margin-bottom: 6px; display: block;
}
.parse-bar__input {
  width: 100%; min-height: 64px; border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm); padding: 10px 12px; font-family: inherit;
  font-size: 0.85rem; background: var(--surface-2); color: var(--text);
  outline: none; resize: vertical; line-height: 1.5;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.parse-bar__input:focus { border-color: var(--gold); border-style: solid; box-shadow: 0 0 0 3px rgba(184,134,11,0.10); background: var(--surface); }
.parse-bar__actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.parse-btn {
  height: 36px; padding: 0 16px; border: 1px solid var(--gold);
  border-radius: var(--radius-sm); background: var(--gold-soft); color: var(--gold-text);
  font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; gap: 6px;
}
.parse-btn:hover { background: var(--gold); color: #fff; }
.parse-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.parse-btn__spinner {
  width: 14px; height: 14px; border: 2px solid currentColor;
  border-top-color: transparent; border-radius: 50%;
  animation: parseSpin 0.7s linear infinite; display: none;
}
.parse-btn--loading .parse-btn__spinner { display: block; }
@keyframes parseSpin { to { transform: rotate(360deg); } }
.parse-bar__hint { font-size: 0.68rem; color: var(--text-3); }
.parse-bar__warning {
  margin-top: 8px; padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--gold-soft); color: var(--gold-text);
  font-size: 0.75rem; font-weight: 500; display: none;
}
.parse-bar__warning--visible { display: block; }
.parse-bar__toggle {
  width: 100%; height: 38px; border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface-2); color: var(--gold-text);
  font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.parse-bar__toggle:hover { border-color: var(--gold); background: var(--gold-soft); }
.parse-bar__body { margin-top: 10px; animation: parseBodyIn 0.2s var(--ease); }
@keyframes parseBodyIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.parse-bar__clear {
  margin-left: auto; height: 36px; padding: 0 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: transparent; color: var(--text-3);
  font-family: inherit; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
}
.parse-bar__clear:hover { border-color: var(--text-3); color: var(--text); }

/* Rate stepper: − 输入 + 三格一体 */
.rate-stepper { display: flex; align-items: center; gap: 8px; }
.rate-stepper .input-with-suffix { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.rate-stepper .input-with-suffix .form-field__input { padding-right: 28px; }
.input-with-suffix__suffix {
  position: absolute; right: 10px; font-family: var(--font-numeric);
  font-size: 0.85rem; color: var(--text-3); pointer-events: none; font-weight: 600;
}
.rate-stepper__btn {
  width: 42px; height: 42px; flex: none;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text);
  font-size: 1.25rem; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  line-height: 1; padding: 0;
  transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
}
.rate-stepper__btn:hover { border-color: var(--gold); color: var(--gold-text); background: var(--gold-soft); }
.rate-stepper__btn:active { transform: scale(0.93); }

/* Profit preview */
.profit-preview {
  background: var(--success-soft); border-radius: var(--radius-md);
  padding: 16px; margin-bottom: 14px; text-align: center;
  border: 1px solid rgba(58,125,58,0.15);
}
.profit-preview__label { font-size: 0.65rem; color: var(--success); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.profit-preview__value {
  font-family: var(--font-numeric); font-size: 2.2rem; font-weight: 600;
  color: var(--success); line-height: 1.15; margin-top: 4px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.profit-preview__formula { font-size: 0.72rem; color: var(--text-3); margin-top: 6px; }

.submit-btn {
  width: 100%; height: 48px; border: none; border-radius: var(--radius-md);
  background: var(--gold); color: #fff; font-family: inherit;
  font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-top: 10px;
  box-shadow: 0 2px 6px rgba(184,134,11,0.25);
  transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
  letter-spacing: 0.02em;
}
.submit-btn:hover { box-shadow: 0 4px 10px rgba(184,134,11,0.35); }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

/* ═══ EMPTY & TOAST ═══ */
.empty-state { text-align: center; padding: 56px 24px; color: var(--text-3); }
.empty-state__text { font-size: 0.875rem; line-height: 1.6; }
.toast-container {
  position: fixed; top: calc(var(--safe-top) + 12px); left: 50%;
  transform: translateX(-50%); z-index: 9999; display: flex;
  flex-direction: column; gap: 6px; pointer-events: none;
}
.toast {
  background: var(--accent); color: var(--bg); padding: 10px 20px;
  border-radius: 24px; font-size: 0.8rem; font-weight: 500;
  box-shadow: var(--shadow-lg); animation: toastIn 0.3s var(--ease);
}
.toast--error { background: var(--danger); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(0.9); } to { opacity: 1; transform: scale(1); } }

.pagination { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px; }
.pagination button {
  height: 36px; padding: 0 16px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface);
  font-family: inherit; font-size: 0.8rem; cursor: pointer; color: var(--text);
  transition: all 0.2s;
}
.pagination button:hover:not(:disabled) { border-color: var(--gold); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination__info { font-size: 0.75rem; color: var(--text-3); }

@keyframes listIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ═══ MONTHLY STATS ═══ */
.monthly-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 16px; margin-bottom: 10px;
  transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
  animation: listIn 0.3s var(--ease) both; cursor: pointer;
}
.monthly-card:active { transform: scale(0.985); box-shadow: var(--shadow-sm); }
.monthly-card__header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.monthly-card__month {
  font-family: var(--font-serif); font-size: 1.05rem; font-weight: 600;
}
.monthly-card__count {
  font-size: 0.72rem; color: var(--text-3);
}
.monthly-card__stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.monthly-card__stat {
  text-align: center;
}
.monthly-card__stat-label {
  font-size: 0.62rem; color: var(--text-3); text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 4px;
}
.monthly-card__stat-value {
  font-family: var(--font-numeric); font-size: 0.95rem; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.monthly-card__stat-detail {
  font-size: 0.6rem; color: var(--text-3); margin-top: 3px; line-height: 1.3;
}
.monthly-card__stat--profit .monthly-card__stat-value { color: var(--success); }

@media (min-width: 431px) {
  .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}

/* 横屏优化 */
@media (orientation: landscape) and (max-height: 500px) {
  .header { --header-h: 44px; }
  .header__title { font-size: 0.9rem; }
  .header__subtitle { font-size: 0.65rem; }
  .view-tabs, .seller-tabs { height: 38px; padding: 2px; }
  .view-tab, .seller-tab { font-size: 0.75rem; height: 34px; }
  .content { padding-top: 12px; padding-bottom: calc(var(--safe-bottom) + 70px); }
  .fab { width: 52px; height: 52px; font-size: 1.4rem; }
  .stats-grid { gap: 8px; margin-bottom: 12px; }
  .stat-card { padding: 12px 10px; }
}

/* ═══ LOADING OVERLAY ═══ */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(244, 241, 234, 0.95);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.loading-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* 小猫转圈加载动画 - 来自 demo */
.cat {
  position: relative;
  width: 100%;
  max-width: 8em;
  overflow: hidden;
  background-color: #F4F1EA; /* 米白色背景，匹配加载层 */
  border-radius: 12px; /* 添加圆角 */
}
.cat::before {
  content: '';
  display: block;
  padding-bottom: 100%;
}

.cat__head, .cat__tail, .cat__body {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  animation: rotating 2.79s cubic-bezier(0.65, 0.54, 0.12, 0.93) infinite;
}
.cat__head::before, .cat__tail::before, .cat__body::before {
  content: '';
  position: absolute;
  width: 50%;
  height: 50%;
  background-size: 200%;
  background-repeat: no-repeat;
  background-image: url("/cat-loading.png");
}

.cat__head::before {
  top: 0;
  right: 0;
  background-position: 100% 0%;
  transform-origin: 0% 100%;
  transform: rotate(90deg);
}

.cat__tail {
  animation-delay: .2s;
}
.cat__tail::before {
  left: 0;
  bottom: 0;
  background-position: 0% 100%;
  transform-origin: 100% 0%;
  transform: rotate(-30deg);
}

.cat__body {
  animation-delay: .1s;
}
.cat__body:nth-of-type(2) {
  animation-delay: .2s;
}
.cat__body::before {
  right: 0;
  bottom: 0;
  background-position: 100% 100%;
  transform-origin: 0% 0%;
}

@keyframes rotating {
  from {
    transform: rotate(720deg);
  }
  to {
    transform: none;
  }
}

/* 加载文字 */
.loading-text {
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.875rem;
  color: var(--text-2);
  font-weight: 500;
  white-space: nowrap;
}

/* ═══ LOGIN PAGE ═══ */
.login-page {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  z-index: 9999;
}
.login-card {
  text-align: center;
  max-width: 360px;
  width: 100%;
}
.login-card__title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text);
}
.login-card__subtitle {
  font-size: 0.875rem;
  color: var(--text-3);
  margin-bottom: 32px;
}
.login-card__dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 40px;
  min-height: 16px;
}
.login-card__dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  transition: all 0.2s var(--ease);
}
.login-card__dot--filled {
  background: var(--gold);
  border-color: var(--gold);
  transform: scale(1.1);
}
.login-card__dot--error {
  background: var(--danger);
  border-color: var(--danger);
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.login-card__keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  max-width: 280px;
  margin: 0 auto;
}
.login-card__key {
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 1.5rem;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.login-card__key:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.login-card__key:active {
  transform: scale(0.95);
  background: var(--surface-3);
}
.login-card__key--delete {
  font-size: 1.1rem;
  color: var(--text-3);
}
.login-card__key--empty {
  visibility: hidden;
}
.login-card__error {
  color: var(--danger);
  font-size: 0.875rem;
  margin-top: 20px;
  min-height: 20px;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
.login-card__error--visible {
  opacity: 1;
}

</style>
</head>
<body>

<!-- ═══ LOGIN PAGE ═══ -->
<div class="login-page" id="loginPage" style="display: none;">
  <div class="login-card">
    <h1 class="login-card__title">Joeyzou记账本</h1>
    <p class="login-card__subtitle">输入密码</p>

    <!-- 密码点指示器 -->
    <div class="login-card__dots" id="loginDots">
      <div class="login-card__dot"></div>
      <div class="login-card__dot"></div>
      <div class="login-card__dot"></div>
      <div class="login-card__dot"></div>
    </div>

    <!-- 数字键盘 -->
    <div class="login-card__keypad">
      <button type="button" class="login-card__key" data-key="1">1</button>
      <button type="button" class="login-card__key" data-key="2">2</button>
      <button type="button" class="login-card__key" data-key="3">3</button>
      <button type="button" class="login-card__key" data-key="4">4</button>
      <button type="button" class="login-card__key" data-key="5">5</button>
      <button type="button" class="login-card__key" data-key="6">6</button>
      <button type="button" class="login-card__key" data-key="7">7</button>
      <button type="button" class="login-card__key" data-key="8">8</button>
      <button type="button" class="login-card__key" data-key="9">9</button>
      <button type="button" class="login-card__key login-card__key--empty"></button>
      <button type="button" class="login-card__key" data-key="0">0</button>
      <button type="button" class="login-card__key login-card__key--delete" data-key="delete">⌫</button>
    </div>

    <div class="login-card__error" id="loginError"></div>
  </div>
</div>

<div class="app" id="app" style="display: none;">

  <!-- ═══ HEADER ═══ -->
  <header class="header">
    <div class="header__top">
      <div class="header__title">Joeyzou记账本</div>
    </div>
    <div class="view-tabs" id="viewTabs">
      <button class="view-tab view-tab--active" data-view="transactions">交易明细</button>
      <button class="view-tab" data-view="monthly">月度统计</button>
    </div>
    <div class="seller-tabs" id="sellerTabs">
      <button class="seller-tab seller-tab--active" data-seller="company">公司</button>
      <button class="seller-tab" data-seller="personal">个人</button>
    </div>
  </header>

  <!-- ═══ CONTENT ═══ -->
  <main class="content" id="content">

    <div class="stats-grid" id="statsGrid"></div>

    <!-- 交易明细视图 -->
    <div id="transactionsView">
      <div class="section">
        <div class="section__header">
          <div class="section__title">交易明细</div>
          <span id="recordCount" style="font-size:0.7rem;color:var(--text-3);">0 笔</span>
        </div>
        <div class="filter-bar">
          <div class="month-nav">
            <button class="month-nav__btn" id="prevMonth" title="上月">‹</button>
            <button class="month-nav__btn" id="nextMonth" title="下月">›</button>
          </div>
          <input type="month" id="filterMonth">
          <select id="filterChannel">
            <option value="">全部渠道</option>
            <option value="quota">额度</option>
            <option value="direct">直款</option>
            <option value="recovery">回收</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>

      <div id="txnList"></div>
      <div class="pagination" id="pagination" style="display:none;">
        <button id="prevPage">上一页</button>
        <span class="pagination__info" id="pageInfo">1 / 1</span>
        <button id="nextPage">下一页</button>
      </div>
    </div>

    <!-- 月度统计视图 -->
    <div id="monthlyView" style="display:none;">
      <div class="section">
        <div class="section__header">
          <div class="section__title">月度统计</div>
          <select id="yearFilter" style="height:32px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;font-size:0.8rem;background:var(--surface);color:var(--text);"></select>
        </div>
      </div>
      <div id="monthlyList"></div>
    </div>

  </main>

  <!-- ═══ FAB ═══ -->
  <button class="fab" id="fab">+</button>

  <!-- ═══ MODAL ═══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal__handle"></div>
      <div class="modal__title" id="modalTitle">记一笔</div>

      <!-- 当前记账身份标识 -->
      <div class="modal__seller-indicator" id="modalSellerIndicator">
        <span class="modal__seller-label">记账身份：</span>
        <span class="modal__seller-badge" id="modalSellerBadge">公司</span>
      </div>

      <form id="txnForm" novalidate>

        <!-- 智能解析入口（默认折叠，点击展开） -->
        <div class="parse-bar">
          <button type="button" class="parse-bar__toggle" id="parseToggle">✨ 智能解析</button>
          <div class="parse-bar__body" id="parseBody" style="display:none;">
            <label class="parse-bar__label">粘贴或语音描述</label>
            <textarea class="parse-bar__input" id="parseInput" placeholder="例：苏苏的 Chanel CF 中号，额度，售价 35000，我抽 1 个点&#10;（iOS 键盘可点麦克风语音输入）"></textarea>
            <div class="parse-bar__actions">
              <button type="button" class="parse-btn" id="parseBtn"><span class="parse-btn__spinner"></span><span class="parse-btn__text">解析</span></button>
              <span class="parse-bar__hint">自动提取商品、渠道、金额</span>
              <button type="button" class="parse-bar__clear" id="parseClear">清空</button>
            </div>
            <div class="parse-bar__warning" id="parseWarning">⚠️ 解析可信度较低，请仔细核对金额和渠道后再保存</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field" id="sourceField">
            <label class="form-field__label">货源</label>
            <input type="text" class="form-field__input" id="inputSource" list="datalistSource" placeholder="苏苏" autocomplete="off">
            <datalist id="datalistSource"></datalist>
            <div class="form-field__error" id="errorSource"></div>
          </div>
          <div class="form-field" id="brandField">
            <label class="form-field__label">品牌名 <span style="font-weight:400;color:var(--text-3);">(可选)</span></label>
            <input type="text" class="form-field__input" id="inputBrand" list="datalistBrand" placeholder="例：Chanel" autocomplete="off">
            <datalist id="datalistBrand"></datalist>
            <div class="form-field__error" id="errorBrand"></div>
          </div>
        </div>

        <div class="form-field">
          <label class="form-field__label">日期</label>
          <input type="date" class="form-field__input" id="inputDate" required>
          <div class="form-field__error" id="errorDate"></div>
        </div>

        <div class="form-field">
          <label class="form-field__label">商品名称</label>
          <input type="text" class="form-field__input" id="inputProduct" placeholder="例：Chanel 中号 CF" required>
          <div class="form-field__error" id="errorProduct"></div>
        </div>

        <div class="form-field">
          <label class="form-field__label">渠道</label>
          <div class="channel-tabs" id="channelTabs">
            <button type="button" class="channel-tab channel-tab--active" data-channel="quota">额度</button>
            <button type="button" class="channel-tab" data-channel="direct">直款</button>
            <button type="button" class="channel-tab" data-channel="recovery">回收</button>
            <button type="button" class="channel-tab" data-channel="other">其他</button>
          </div>
          <div class="form-field__error" id="errorChannel"></div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-field__label">成本 (¥) <span id="costRequired" style="color:var(--text-3);font-weight:400;">可选</span></label>
            <input type="number" class="form-field__input form-field__input--number" id="inputCost" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
          </div>
          <div class="form-field">
            <label class="form-field__label">售价 (¥) <span id="priceRequired" style="color:var(--text-3);font-weight:400;">可选</span></label>
            <input type="number" class="form-field__input form-field__input--number" id="inputPrice" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
          </div>
        </div>

        <!-- 佣金比例（其他渠道隐藏） -->
        <div class="form-field" id="rateField">
          <label class="form-field__label">佣金比例</label>
          <div class="rate-stepper">
            <button type="button" class="rate-stepper__btn" id="rateMinus" aria-label="减少">−</button>
            <div class="input-with-suffix">
              <input type="number" class="form-field__input form-field__input--number" id="inputRate" placeholder="2.0" step="0.1" min="0" max="100" inputmode="decimal">
              <span class="input-with-suffix__suffix">%</span>
            </div>
            <button type="button" class="rate-stepper__btn" id="ratePlus" aria-label="增加">+</button>
          </div>
          <div class="form-field__hint" id="rateHint">默认 2%，可调整</div>
        </div>

        <!-- 利润预览 -->
        <div class="profit-preview" id="profitPreview">
          <div class="profit-preview__label">预计利润</div>
          <div class="profit-preview__value" id="profitValue">¥0.00</div>
          <div class="profit-preview__formula" id="profitFormula">售价 × 2% = 利润</div>
        </div>

        <!-- 其他渠道：手填利润 -->
        <div class="form-field" id="manualProfitField" style="display:none;">
          <label class="form-field__label">利润 (¥) <span style="color:var(--danger);">*</span></label>
          <input type="number" class="form-field__input form-field__input--number" id="inputProfit" placeholder="0.00" step="0.01" inputmode="decimal">
          <div class="form-field__error" id="errorProfit"></div>
        </div>

        <!-- 款项去向（仅公司交易显示，对账用） -->
        <div class="form-field" id="accountField" style="display:none;">
          <label class="form-field__label">款项去向 <span style="color:var(--text-3);font-weight:400;">可选</span></label>
          <input type="text" class="form-field__input" id="inputAccount" placeholder="例：微信 ¥20,000 + 支付宝 ¥10,000 + 现金 ¥5,000">
          <div class="form-field__hint" id="accountHint">记录这笔钱最终到了哪些账户，方便和老板对账</div>
        </div>

        <div class="form-field">
          <label class="form-field__label">备注 (可选)</label>
          <input type="text" class="form-field__input" id="inputNote">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">确认记录</button>
      </form>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="cat">
    <div class="cat__body"></div>
    <div class="cat__body"></div>
    <div class="cat__tail"></div>
    <div class="cat__head"></div>
  </div>
  <div class="loading-text">加载中...</div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
