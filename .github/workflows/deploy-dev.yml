name: Deploy Dev to Cloudflare Test

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Test Environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Remove legacy plain-text access key binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env test

      - name: Deploy to Cloudflare Workers (Test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env test
          environment: test
          secrets: |
            ACCESS_KEY
        env:
          ACCESS_KEY: ${{ secrets.TEST_ACCESS_KEY }}

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Test URL: https://salesledger-test.chengjiajian2013.workers.dev"
          echo "📦 Environment: test"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
