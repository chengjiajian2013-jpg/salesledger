name = "salesledger"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 静态资源配置
[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "salesledger-db"
database_id = "1a88bdc1-98a3-462f-8f48-8dad0730f6ad"

[vars]
ENV = "development"
ACCESS_KEY = "0725"
# 生产密码通过 wrangler.toml 配置

# Secrets (通过 wrangler secret 命令设置，不要写在这里):
# - DEEPSEEK_API_KEY: DeepSeek API密钥 (用于 parse.js)
# - CLAUDE_API_KEY: Claude API密钥 (用于 ai.js)
#
# 设置方法:
#   wrangler secret put DEEPSEEK_API_KEY --env test
#   wrangler secret put CLAUDE_API_KEY --env test
#   wrangler secret put DEEPSEEK_API_KEY (production)
#   wrangler secret put CLAUDE_API_KEY (production)

# 测试环境配置
[env.test]
name = "salesledger-test"
vars = { ENV = "test" }

[[env.test.d1_databases]]
binding = "DB"
database_name = "salesledger-test-db"
database_id = "6e82a163-0b1a-4031-91d9-fce3979c7c13"
